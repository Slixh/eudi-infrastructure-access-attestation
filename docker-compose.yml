services:
  iaa:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: eudi-iaa:latest
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: "file:/app/data/db.sqlite"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL}"
      RP_SIGNING_KEY_PATH: "${RP_SIGNING_KEY_PATH}"
      RP_ACCESS_CERT_PATH: "${RP_ACCESS_CERT_PATH}"
      RP_CLIENT_ID: "${RP_CLIENT_ID}"
      RP_REGISTRATION_CERT_JWT: "${RP_REGISTRATION_CERT_JWT}"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRY: "${JWT_EXPIRY}"
      ACCESS_SHARED_SECRET: "${ACCESS_SHARED_SECRET}"
    volumes:
      - iaa_data:/app/data
      - ${CERT_SIGNING_KEY:-./api/certs/rp-signing.key}:/app/certs/rp-signing.key:ro
      - ${CERT_ACCESS_CERT:-./api/certs/access-certificate.crt}:/app/certs/access-certificate.crt:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=http_network"
      - "traefik.http.routers.iaa.rule=Host(`iaa.eudi.slixh.com`)"
      - "traefik.http.routers.iaa.entrypoints=https"
      - "traefik.http.routers.iaa.tls.certresolver=le"
      - "traefik.http.services.iaa.loadbalancer.server.port=3000"
    networks:
      - http_network

  panel:
    build:
      context: ./panel
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE: "https://iaa.eudi.slixh.com"
    image: eudi-panel:latest
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: "https://iaa.eudi.slixh.com"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=http_network"
      # More specific rule (PathPrefix) takes priority over the bare iaa router
      - "traefik.http.routers.panel.rule=Host(`iaa.eudi.slixh.com`) && PathPrefix(`/panel`)"
      - "traefik.http.routers.panel.entrypoints=https"
      - "traefik.http.routers.panel.tls.certresolver=le"
      - "traefik.http.services.panel.loadbalancer.server.port=3000"
    networks:
      - http_network

volumes:
  iaa_data:

networks:
  http_network:
    external: true
